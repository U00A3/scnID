[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

fs_permissions = [{ access = "read-write", path = "./broadcast" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
redbelly_testnet = "https://governors.testnet.redbelly.network"
redbelly_mainnet = "https://governors.mainnet.redbelly.network"
